[package]
name = "hangar"
version = "0.1.0"
edition = "2024"
description = "Terminal dashboard for your dev machine: projects, listening ports and deploys in one place"
license = "MIT"
repository = "https://github.com/hamin2006/hangar"
keywords = ["tui", "developer-tools", "ports", "git", "vercel"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
libc = "0.2.189"
open = "5.4.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
